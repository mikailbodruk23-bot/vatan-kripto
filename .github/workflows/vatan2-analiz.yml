
name: VATAN 2 Gelismis Analiz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Coklu zaman analizi
        run: python vatan2-analiz.py
        
