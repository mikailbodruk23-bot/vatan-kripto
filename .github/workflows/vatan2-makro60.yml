name: VATAN 2 Makro ve LONG SHORT Puani

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VATAN 2 Tum Coin Taramasi"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vatan2-makro60
  cancel-in-progress: false

jobs:
  makro_puan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testler
        run: |
          python vatan2-risk-motor.py --self-test
          python vatan2-makro60.py --self-test

      - name: Pages yayinlari icin kisa ara
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 60

      - name: OKX ve resmi makro veri raporu
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python vatan2-risk-motor.py

      - name: Birlesik LONG SHORT puanlari
        run: python vatan2-makro60.py

      - name: Sonuclari guvenle yayinla
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool vatan2-risk.json > /dev/null
          python -m json.tool son-makro60.json > /dev/null
          cp vatan2-risk.json "$RUNNER_TEMP/vatan2-risk.json"
          cp son-makro60.json "$RUNNER_TEMP/son-makro60.json"
          source_hash=$(sha256sum son-tum-analiz.json | cut -d ' ' -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Ekonomik rapor yayinlama denemesi: $attempt"
            git fetch origin main
            git reset --hard origin/main
            latest_source_hash=$(sha256sum son-tum-analiz.json | cut -d ' ' -f1)
            if [ "$latest_source_hash" != "$source_hash" ]; then
              echo 'Tam coin taramasi bu arada degisti; eski ekonomi puanlari yayinlanmayacak' >&2
              exit 1
            fi
            cp "$RUNNER_TEMP/vatan2-risk.json" vatan2-risk.json
            cp "$RUNNER_TEMP/son-makro60.json" son-makro60.json
            git add vatan2-risk.json son-makro60.json
            if git diff --cached --quiet; then
              echo 'Ekonomik rapor zaten guncel'
              exit 0
            fi
            git commit -m 'Update VATAN2 macro long short scoring'
            if git push origin HEAD:main; then
              echo 'Ekonomik LONG SHORT raporu kaydedildi'
              exit 0
            fi
            echo 'Es zamanli commit var; yeniden denenecek'
            sleep $((attempt * 3))
          done
          echo 'Ekonomik rapor yayinlanamadi' >&2
          exit 1
