name: VATAN 2 Makro ve LONG SHORT Puani

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VATAN 2 Tum Coin Taramasi"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vatan2-makro60
  cancel-in-progress: false

jobs:
  makro_puan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testler
        run: |
          python vatan2-risk-motor.py --self-test
          python vatan2-makro60.py --self-test

      - name: Pages yayinlari icin kisa ara
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 60

      - name: OKX ve resmi makro veri raporu
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python vatan2-risk-motor.py

      - name: Birlesik LONG SHORT puanlari
        run: python vatan2-makro60.py

      - name: Sonuclari yayinla
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vatan2-risk.json son-makro60.json
          if git diff --cached --quiet; then
            echo 'Yeni veri yok'
            exit 0
          fi
          git commit -m 'Update VATAN2 macro long short scoring'
          for trial in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo 'Veri cakismasi; islem durduruldu'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'GitHub yayinlama basarisiz' >&2
          exit 1
