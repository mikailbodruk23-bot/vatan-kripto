
name: VATAN 2 Otomatik Tarama

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: VATAN 2 taramasini calistir
        run: python vatan2-scanner.py
