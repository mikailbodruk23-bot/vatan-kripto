
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VATAN 2 - Anlık Canlı Fiyat</title>
<style>
body {
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  padding:18px;
}
h1 {color:#4ade80}
.card {
  background:#172238;
  padding:18px;
  margin:12px 0;
  border-radius:12px;
}
.price {
  color:#4ade80;
  font-size:26px;
  font-weight:bold;
  margin-top:10px;
  overflow-wrap:anywhere;
}
#status {color:#facc15;margin:15px 0}
small {color:#94a3b8}
</style>
</head>
<body>

<h1>🇹🇷 VATAN 2</h1>
<p>Binance Futures Anlık Canlı Fiyat</p>
<div id="status">Bağlanıyor...</div>

<div class="card">
  <strong>BTCUSDT</strong>
  <div class="price" id="BTCUSDT">Bekleniyor...</div>
</div>

<div class="card">
  <strong>ETHUSDT</strong>
  <div class="price" id="ETHUSDT">Bekleniyor...</div>
</div>

<div class="card">
  <strong>SOLUSDT</strong>
  <div class="price" id="SOLUSDT">Bekleniyor...</div>
</div>

<small>Canlı piyasa verisidir. Al-sat sinyali değildir.</small>

<script>
const symbols = ["btcusdt","ethusdt","solusdt"];
const statusEl = document.getElementById("status");
let socket;
let retryTimer;
let lastMessage = 0;

function connect() {
  clearTimeout(retryTimer);
  statusEl.textContent = "Binance bağlantısı kuruluyor...";
  statusEl.style.color = "#facc15";

  const streams = symbols.map(s => s + "@markPrice@1s").join("/");
  socket = new WebSocket(
    "wss://fstream.binance.com/stream?streams=" + streams
  );

  socket.onopen = () => {
    statusEl.textContent = "Bağlandı, canlı veri bekleniyor...";
    lastMessage = Date.now();
  };

  socket.onmessage = event => {
    try {
      const packet = JSON.parse(event.data);
      const data = packet.data;
      if (!data || !data.s || !data.p) return;

      const el = document.getElementById(data.s);
      const price = Number(data.p);
      if (!el || !Number.isFinite(price)) return;

      el.textContent = price.toLocaleString("en-US", {
        minimumFractionDigits:2,
        maximumFractionDigits:6
      }) + " USDT";

      lastMessage = Date.now();
      statusEl.textContent =
        "CANLI ● Son veri: " +
        new Date().toLocaleTimeString("tr-TR");
      statusEl.style.color = "#4ade80";
    } catch (error) {
      console.warn("Veri işleme hatası", error);
    }
  };

  socket.onerror = () => {
    statusEl.textContent = "Bağlantı hatası, yeniden deneniyor...";
    statusEl.style.color = "#f87171";
  };

  socket.onclose = () => {
    statusEl.textContent = "Bağlantı koptu, tekrar bağlanıyor...";
    statusEl.style.color = "#facc15";
    retryTimer = setTimeout(connect, 3000);
  };
}

setInterval(() => {
  if (socket && socket.readyState === WebSocket.OPEN &&
      Date.now() - lastMessage > 15000) {
    socket.close();
  }
}, 5000);

connect();
</script>
</body>
</html>
