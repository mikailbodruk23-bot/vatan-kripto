
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VATAN 2 - Canlı Binance Testi</title>
<style>
body{background:#0b1220;color:white;font-family:Arial,sans-serif;padding:18px}
h1{font-size:23px}
.card{background:#172238;padding:18px;margin:12px 0;border-radius:12px}
.price{font-size:25px;color:#4ade80;font-weight:bold;margin-top:8px}
#status{color:#facc15;margin:15px 0}
small{color:#94a3b8}
</style>
</head>
<body>
<h1>🇹🇷 VATAN 2</h1>
<p>Binance Futures Canlı Fiyat Testi</p>
<div id="status">Bağlantı bekleniyor...</div>

<div class="card">
<strong>BTCUSDT</strong>
<div class="price" id="BTCUSDT">Bekleniyor...</div>
</div>

<div class="card">
<strong>ETHUSDT</strong>
<div class="price" id="ETHUSDT">Bekleniyor...</div>
</div>

<div class="card">
<strong>SOLUSDT</strong>
<div class="price" id="SOLUSDT">Bekleniyor...</div>
</div>

<small>Gösterilen fiyatlar Binance Futures mark price verileridir. İşlem sinyali değildir.</small>

<script>
window.addEventListener("vatan-price",event=>{
 const {symbol,price,timestamp}=event.detail;
 const el=document.getElementById(symbol);
 if(!el)return;
 el.textContent=price.toLocaleString("en-US",{
  minimumFractionDigits:2,
  maximumFractionDigits:6
 })+" USDT";
 document.getElementById("status").textContent=
 "Canlı veri alınıyor - "+new Date(timestamp).toLocaleTimeString("tr-TR");
 document.getElementById("status").style.color="#4ade80";
});
</script>
<script src="./binance-live.js"></script>
</body>
</html>
